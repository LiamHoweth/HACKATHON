<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif">
<style>@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=block');</style>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b5d46"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#13325b"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#121417"/></marker>
</defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="40" y="70" font-size="44" font-weight="700" fill="#121417" text-anchor="start">One turn, end to end</text>
<text x="40" y="108" font-size="24" font-weight="400" fill="#464b53" text-anchor="start">Suggestions arrive about 3.6 s after the partner stops talking; the chosen voice then plays at once.</text>
