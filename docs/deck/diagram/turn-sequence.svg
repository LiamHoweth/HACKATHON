<text x="410" y="180" font-size="24" font-weight="700" fill="#0b5d46" text-anchor="middle">Person</text>
<path d="M 410 202 L 410 975" stroke="#c9ccd1" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="585" y="140" width="210" height="62" rx="14" fill="#ffffff" stroke="#0b5d46" stroke-width="2.5"/>
<text x="690" y="180" font-size="24" font-weight="700" fill="#0b5d46" text-anchor="middle">iPad app</text>
