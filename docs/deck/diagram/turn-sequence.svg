<text x="985" y="180" font-size="24" font-weight="700" fill="#13325b" text-anchor="middle">Railway server</text>
<path d="M 985 202 L 985 975" stroke="#c9ccd1" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="1155" y="140" width="210" height="62" rx="14" fill="#ffffff" stroke="#121417" stroke-width="2.5"/>
<text x="1260" y="180" font-size="24" font-weight="700" fill="#121417" text-anchor="middle">OpenAI</text>
<path d="M 1260 202 L 1260 975" stroke="#c9ccd1" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="1395" y="140" width="210" height="62" rx="14" fill="#ffffff" stroke="#121417" stroke-width="2.5"/>
<text x="1500" y="180" font-size="24" font-weight="700" fill="#121417" text-anchor="middle">ElevenLabs</text>
<path d="M 1500 202 L 1500 975" stroke="#c9ccd1" stroke-width="2" stroke-dasharray="6 6"/>
<text x="1772" y="180" font-size="24" font-weight="700" fill="#121417" text-anchor="middle">Measured</text>
<circle cx="40" cy="262" r="19" fill="#0b5d46"/>
<text x="40" y="270" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<path d="M 170 262 L 686 262" stroke="#121417" stroke-width="3" fill="none" marker-end="url(#k)"/>
<text x="300.0" y="250" font-size="22" font-weight="400" fill="#121417" text-anchor="middle">speaks</text>
<text x="708" y="270" font-size="22" font-weight="400" fill="#464b53" text-anchor="start">waits for 0.65 s of silence</text>
<rect x="1655" y="222" width="235" height="80" rx="14" fill="#eef6f2" stroke="#0b5d46" stroke-width="2"/>
<text x="1772" y="256" font-size="26" font-weight="700" fill="#0b5d46" text-anchor="middle">0.65 s</text>
<text x="1772" y="286" font-size="20" font-weight="400" fill="#464b53" text-anchor="middle">end of speech</text>
<circle cx="40" cy="397.0" r="19" fill="#0b5d46"/>
<text x="40" y="405.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
